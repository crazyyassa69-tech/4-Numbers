name: Build 4 Numbers APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          mkdir -p android_project
          unzip -q 4Numbers_Android_Project.zip -d android_project

      - name: Build Android APK
        run: |
          GRADLEW="$(find android_project -type f -name gradlew -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found"
            find android_project -maxdepth 3 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          chmod +x "$GRADLEW"
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 4-Numbers-APK
          path: android_project/**/build/outputs/apk/debug/*.apk
